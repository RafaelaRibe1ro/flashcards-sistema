spring.application.name=sistema-flashcards
server.port=8080

# H2 (banco em arquivo — persiste entre reinicializações)
spring.datasource.url=jdbc:h2:file:./data/flashcardsdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Console H2 (acessar em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# RabbitMQ — broker de eventos (sobe via docker-compose.yml na raiz do repo)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Retry do listener antes de mandar a mensagem para a dead-letter queue
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Monitoramento (Etapa 5)
# Actuator: /actuator/health é usado pelos probes do Kubernetes
management.endpoints.web.exposure.include=health,info
# Rastreamento: envia 100% das requisições para o Zipkin (inclui as mensagens do RabbitMQ)
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true
# Agregação de logs: endereço do Loki usado no logback-spring.xml
loki.url=http://localhost:3100/loki/api/v1/push
