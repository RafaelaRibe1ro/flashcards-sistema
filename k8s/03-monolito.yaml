apiVersion: apps/v1
kind: Deployment
metadata:
  name: sistema-flashcards
  namespace: flashcards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sistema-flashcards
  template:
    metadata:
      labels:
        app: sistema-flashcards
    spec:
      containers:
        - name: sistema-flashcards
          image: flashcards-monolito:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT
              value: http://zipkin:9411/api/v2/spans
            - name: LOKI_URL
              value: http://loki:3100/loki/api/v1/push
          # Só recebe tráfego quando a aplicação terminou de subir
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          # Se parar de responder, o Kubernetes reinicia o container
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sistema-flashcards
  namespace: flashcards
spec:
  type: LoadBalancer
  selector:
    app: sistema-flashcards
  ports:
    - port: 8080
      targetPort: 8080
