# Zipkin (rastreamento), Loki (logs) e Grafana (visualização)

# ---------- Zipkin ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: flashcards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin
          ports:
            - containerPort: 9411
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: flashcards
spec:
  type: LoadBalancer
  selector:
    app: zipkin
  ports:
    - port: 9411
      targetPort: 9411
---
# ---------- Loki ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: flashcards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.4.2
          ports:
            - containerPort: 3100
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: flashcards
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
---
# ---------- Grafana ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: flashcards
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
      - name: Zipkin
        type: zipkin
        access: proxy
        url: http://zipkin:9411
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: flashcards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana
          ports:
            - containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: flashcards
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
